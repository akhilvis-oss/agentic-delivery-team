name: Story
description: A user story with context and verbatim acceptance criteria. Agents start only after the owner approves it.
title: "<Short outcome-focused title>"
body:
  - type: markdown
    attributes:
      value: |
        Write for an agent that has never seen your chats: everything it needs must be here or in `docs/product/`.
  - type: textarea
    id: story
    attributes:
      label: Story
      description: "As a <user>, I want <capability>, so that <outcome>."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and rationale
      description: Why this matters now, background from the product docs, and links to related decisions.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: |
        One per line, numbered, testable. Agents copy these into the PR verbatim.
        Example: "- AC-1: Given ..., when ..., then ..."
      value: |
        - AC-1:
        - AC-2:
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test scenarios
      description: Main path, edge cases and failure cases. Cover every acceptance criterion with at least one scenario, and name the critical regression tests that must keep passing.
      value: |
        - Main path (AC-1):
        - Edge case:
        - Failure case:
        - Critical regression set:
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Roadmap section
      description: The section ID from docs/product/roadmap.md, for example S1.
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone and weight
      description: The milestone this story counts towards and its share of it, for example "M1, 20%". Weights in a milestone add up to 100%.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this story deliberately does not cover.
  - type: textarea
    id: must_ask
    attributes:
      label: Must-ask overrides (optional)
      description: Extra items agents must ask about for this story, or items pre-approved for it (for example "schema change expected").
  - type: textarea
    id: owner_decisions
    attributes:
      label: Owner decisions
      description: Optional. Answer the builder's quoted questions here, then re-approve the story. The next build reads this section.
  - type: textarea
    id: continue_from
    attributes:
      label: Saved work (optional)
      description: Optional. Paste the complete two-line block from the runner's stop comment here, including the heading. Keep the heading and Commit line adjacent, with no blank line between them. GitHub adds a blank line after form labels, so the Commit line alone will start fresh. Leave empty to restart fresh. At most two continuations, each with one correction round.
      placeholder: |
        ### Continue from
        Commit: <40-character lowercase commit ID>
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Stories or decisions this depends on.
