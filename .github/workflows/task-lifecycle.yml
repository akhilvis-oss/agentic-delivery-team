# Opt-in installation by the owner, with populated .github/task-lifecycle.json.
# This workflow never checks out or executes a pull request's code.
name: Trusted task lifecycle
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  actions: read
concurrency:
  group: lifecycle-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read trusted default-branch code and policy only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lifecycle/
            /.github/task-lifecycle.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate the label event or synchronize the PR
        env:
          RUNNER_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -I lifecycle/core.py --config .github/task-lifecycle.json
          guard-event --event "$GITHUB_EVENT_PATH"
