# PR-controlled build checks; not the trusted enforcement path.
# The required review-gate job lives in pr-review-gate.yml (pull_request_target).
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Private content check
        run: python scripts/check_private_content.py
      - name: Verify guard token identity (read-only)
        env:
          RUNNER_GITHUB_TOKEN: ${{ github.token }}
        run: python -I lifecycle/core.py --config .github/task-lifecycle.json guard-identity
      - name: Install pinned development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check --no-cache .
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
